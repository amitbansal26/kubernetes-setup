kubernetes_packages:
  - name: kubelet
    state: present
  - name: kubectl
    state: present
  - name: kubeadm
    state: present
  - name: kubernetes-cni
    state: present

kubernetes_version: '1.30'

kubernetes_pod_network:
  # Calico CNI.
  cni: 'calico'
  cidr: '20.96.0.0/12'

kubernetes_apiserver_advertise_address: '172.16.16.101'  
kubernetes_kubeadm_kubelet_config_file_path: '/etc/kubernetes/kubeadm-kubelet-config.yaml'
kubernetes_config_kubelet_configuration:
  cgroupDriver: "systemd"

kubernetes_config_init_configuration:
  localAPIEndpoint:
    advertiseAddress: "{{ kubernetes_apiserver_advertise_address | default(ansible_default_ipv4.address, true) }}"

kubernetes_config_cluster_configuration:
  networking:
    podSubnet: "{{ kubernetes_pod_network.cidr }}"
  kubernetesVersion: "{{ kubernetes_version_kubeadm }}"
  controlPlaneEndpoint: "172.16.16.100:6443"


containerd_package: containerd.io
docker_yum_gpg_key: https://download.docker.com/linux/centos/gpg
containerd_service_state: started
containerd_service_enabled: true

kubernetes_version_kubeadm: 'v1.30.4'
procps_package: procps-ng


tigera_operator_version: 'v1.32.3'
etcd_version: '3.5.12-0'
pause_version: '3.9'
coredns_version: 'v1.11.1'
calico_version: 'v3.27.0'

nexus_ip: '172.16.16.122'
containerd_hosts_path: "/etc/containerd/certs.d/{{ nexus_ip }}/hosts.toml"
ansible_ssh_private_key_file: "/home/amit/.ssh/id_rsa"
longhorn_version: "1.7.1"

# All locations
kubernetes_package_download_dir: "/home/amit/packages"
lb_package_download_dir: "/home/amit/lb"
image_path: /home/amit/images
# Copy kubernetes Config on this machine
ansible_host_kube_directory: /home/amit/.kube/
ansible_host_download_directory: /home/amit
# Directory where the [packages will be transferred and unzipped on remote machine
basedir: /home/amit